<?xml version="1.0" encoding="UTF-8"?>
<!-- Green Bean concept: a compact seed with a small leaf, on a soft ivory tile. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFCF7"/>
      <stop offset="1" stop-color="#EDF3E9"/>
    </linearGradient>
    <linearGradient id="seed" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#39AD65"/>
      <stop offset="1" stop-color="#137449"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#87D371"/>
      <stop offset="1" stop-color="#49AD5B"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="15" stdDeviation="17" flood-color="#17432D" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect x="61" y="61" width="902" height="902" rx="202" fill="url(#tile)"/>
  <g transform="translate(534 547) rotate(26)" filter="url(#shadow)">
    <path d="M 12 -260
             C -132 -288 -222 -139 -220 16
             C -218 178 -110 291 30 277
             C 153 264 211 160 151 80
             C 118 36 54 3 65 -49
             C 74 -96 137 -118 140 -174
             C 143 -224 87 -250 12 -260 Z" fill="url(#seed)"/>
    <path d="M 35 -252 C 9 -313 30 -356 88 -378
             C 117 -322 96 -276 35 -252 Z" fill="url(#leaf)"/>
  </g>
</svg>
