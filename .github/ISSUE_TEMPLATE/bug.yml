name: Bug report
description: Report reproducible incorrect behavior using synthetic text.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private writing, clipboard contents, or sensitive screenshots.
  - type: input
    id: bean-version
    attributes:
      label: Bean version
      placeholder: 1.2.0 (3) or commit SHA
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App and version where the issue occurred
      placeholder: Slack 4.x, TextEdit, Chrome 1xx
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Bean surface
      options:
        - Quick Proofread shortcut
        - Bean action menu
        - Bean Bubble
        - Passive Suggestions
        - Native inline highlights
        - Browser extension
        - Settings or onboarding
        - Build or packaging
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a short synthetic sentence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Content-free diagnostics
      description: Paste Settings → Troubleshooting → Copy Diagnostics Summary after reviewing it.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all API keys, private text, and sensitive information.
          required: true
