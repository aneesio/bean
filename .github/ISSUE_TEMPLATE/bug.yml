name: Bug report
description: Report reproducible incorrect behavior using synthetic text.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Before posting, use Bean Settings → Privacy & Help → Preview Support Report and review every line. Do not include API keys, private writing, clipboard contents, personal hostnames, or sensitive screenshots. Bean never uploads the preview for you.
  - type: input
    id: bean-version
    attributes:
      label: Bean version
      placeholder: 1.6.0 (8) or commit SHA
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App and version where the issue occurred
      placeholder: Slack 4.x, TextEdit, Chrome 1xx
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Bean surface
      options:
        - Quick Proofread shortcut
        - AI Proofread
        - Bean action menu
        - Bean Bubble
        - Live suggestions
        - Browser extension
        - Settings, onboarding, or About
        - Support Report or Full Reset
        - Build or packaging
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a short synthetic sentence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed support report or diagnostics
      description: Paste only the reviewed lines from Preview Support Report or Copy Diagnostics Summary. Opening this form did not attach anything automatically.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed every pasted line and removed API keys, private text, personal hostnames, and other sensitive information.
          required: true
