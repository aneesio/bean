name: Feature proposal
description: Propose a focused improvement to Bean.
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should Bean solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Privacy, permission, reliability, and API-cost impact
      description: Explain any new data storage, network call, permission, automatic behavior, or provider spend.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I reviewed the public roadmap and understand broad new providers or actions should be discussed before implementation.
          required: true
