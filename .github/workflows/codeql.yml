name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 11 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            os: macos-15
            build_mode: manual
          - language: javascript-typescript
            os: ubuntu-latest
            build_mode: none
          - language: actions
            os: ubuntu-latest
            build_mode: none
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}

      - name: Build Swift
        if: matrix.language == 'swift'
        run: swift build

      - name: Analyze
        uses: github/codeql-action/analyze@v4
